[project]
name = "claude-hardware-backend"
version = "0.1.0"
description = "Backend for Claude Hardware: FastAPI, build123d, CadQuery and the Claude Agent SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # build123d 0.12 and CadQuery 2.8 share OCP 7.9, so both backends run in one process.
  "build123d>=0.12,<0.13",
  "cadquery>=2.8,<2.9",
  "claude-agent-sdk>=0.1",
  "pydantic>=2.7",
  # Multipart form parsing for attachment uploads (app/attachments.py).
  "python-multipart>=0.0.9",
  "pyyaml>=6",
  # Exporters (geometry/export.py): DXF profiles and the PDF drawing.
  "ezdxf>=1.1",
  "matplotlib>=3.8",
  # Linear programs for conflict detection (geometry/conflicts.py); build123d needs it too.
  "scipy>=1.11",
  # Model availability checks against the Claude API (app/model_availability.py).
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  # Runs the suite in parallel in `make test`.
  "pytest-xdist>=3.5",
  "ruff>=0.6",
  "pyyaml>=6",
  # Re-importing the exports in tests: meshes (3MF needs networkx and lxml) and the PDF.
  "trimesh>=4",
  "networkx>=3",
  "lxml>=5",
  "pypdf>=4",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "geometry*"]

[tool.setuptools.package-data]
geometry = ["backends/*/prompt.md", "backends/*/examples/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import this checkout's app, not wherever the virtualenv's editable install points (a
# virtualenv copied from another checkout or worktree still points at that one).
pythonpath = ["."]
# Slow tests call the real model and are billed: run them with `pytest -m slow`.
addopts = "-m 'not slow'"
markers = ["slow: calls the real model; on demand only (`pytest -m slow`)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
