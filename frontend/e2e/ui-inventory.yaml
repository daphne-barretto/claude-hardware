    name: "/^Open constraints: \\d+ (pass|fail|untested|not applicable)$/"
    within: region "Canvas" >> region "Parameters" >> region "Rebuild"
    nth: 0
    states: [session.parameters.locked, session.undone]
    test_in: session.parameters.locked
    expect:
      - visible: region "Canvas" >> region "Constraints"
