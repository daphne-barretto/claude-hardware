  # ---------------------------------------------------------------- Session canvas: tracked changes
  # The run's proposed changes (fixtures/change-set.json): a numbered pin each, and the panel
  # with accept and reject per change. Hidden while comparing.
  - id: changes.toggle
    screen: session canvas
    role: button
    name: Proposed changes
    within: region "Canvas"
    states: ["session*", new.answered]
    test_in: session
    expect:
      - attribute: { name: aria-expanded, value: "true" }
      - visible: region "Proposed changes" >> list "Changes to review"
  - id: changes.pin
    screen: session canvas
    each: changes
    role: button
    name: "Change {it.n}: {it.title}"
    within: region "Canvas"
    states: ["session*", new.answered]
    # Pins are on the build the changes apply to; a hand edit rebuilds without them.
    except: [session.parameters.locked, session.undone]
    test_in: session
    expect:
      - attribute: { name: aria-pressed, value: "true" }
      - visible: region "Proposed changes" >> list "Changes to review"
      - attribute: { of: testid "viewer", name: data-zoom, value: "300" }
  - id: changes.accept
    screen: session canvas
    each: changes
    role: button
    name: "Accept change {it.n}"
    within: region "Proposed changes"
    states: [session.changes]
    # Rebuilds with the change; the button then says it is accepted.
    expect:
      - request: { method: POST, url: "/changes$", body: { accept: ["{it.id}"], reject: [] } }
      - attribute: { name: title, value: Already accepted }
  - id: changes.reject
    screen: session canvas
    each: changes
    role: button
    name: "Reject change {it.n}"
    within: region "Proposed changes"
    states: [session.changes]
    expect:
      - request: { method: POST, url: "/changes$", body: { accept: [], reject: ["{it.id}"] } }
      - attribute: { name: title, value: Already rejected }
  # The proposal's check counts open the Constraints panel on their group.
  - id: changes.open-checks
    screen: session canvas
    role: button
