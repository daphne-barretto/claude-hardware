  # It is a session like any other: the composer, the canvas tools, share, undo.
  - id: sidebar.demo
    screen: sidebar
    dynamic: true
    role: link
    name: "/ Demo$/"
    within: complementary "Sidebar" >> list "Recents"
    states: ["*"]
    except: ["*no-sidebar*", "search*", "home.recents-collapsed"]
