  # Dimensions on the model: clicking one types a value, dragging a face of a draggable
  # feature changes its parameter (frontend/e2e/dimensions.spec.ts drags).
  - id: canvas.dimensions
    screen: session canvas
    role: button
    name: Dimensions
    within: region "Canvas" >> toolbar "Canvas controls"
    states: ["session*"]
    test_in: session
    expect:
