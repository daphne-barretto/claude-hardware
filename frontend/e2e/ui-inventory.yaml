  - id: sidebar.rename-field
    screen: sidebar
    role: textbox
    name: Session name
    within: complementary "Sidebar"
    states: [new.renaming]
    action: [{ fill: self, text: Inventory rename }, { press: Enter }]
    expect:
      - visible: complementary "Sidebar" >> link "Inventory rename"
  # The demos (demos/sessions/), after the user's own, each tagged "Demo". A demo not opened
  # yet links to /demo/<id>, which makes this browser's own copy (POST /api/demos/{id}/session)
