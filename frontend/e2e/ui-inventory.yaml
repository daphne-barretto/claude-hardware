# UI interaction inventory: every interactive element on every screen and state.
#
# `make e2e` checks it on every run, in CI and in QA against staging
# (frontend/e2e/ui-inventory.spec.ts, library in frontend/e2e/inventory/ui-inventory.ts):
#   - coverage: in each state, every control in the accessibility tree has an entry here,
#     and every entry listed for that state is there;
#   - behaviour: each entry's interaction is performed and its expected result checked; it
#     fails on a missed result, no observable effect, a console error or an unhandled rejection;
#   - hygiene: a disabled control must look disabled (dimmed or a not-allowed cursor) and say
#     why (title or aria-describedby). A control whose feature isn't built is hidden, not dead.
#
# Every UI pull request updates this file for the controls it adds, changes or removes.
#
# Format
#   ready:  selector that marks the app as hydrated; every state waits for it.
#   speech: what the stubbed speech recognition "hears" (the tests replace the browser's).
#   states: id, screen, and either url (with optional steps), from (a parent state plus
#     steps) or a first mock_session step. mock_api: true needs the mock session API, so it
#     is skipped against staging.
#     allow_console: a console error text the state expects (a substring), such as the
#     browser's failed-load message for a session that is gone; inherited by its children.
#   entries:
#     id, screen
#     role and name: the accessible role and name. A name in /slashes/ is a regex.
#       Shortcuts and pointer gestures use role shortcut or pointer; they have no name in
#       the accessibility tree, so only their behaviour is tested.
#     within: an ancestor in the accessibility tree, `role "name"`, chained with " >> ".
#     nth: which of several controls with the same role and name the behaviour test uses.
#     states: state id patterns (* matches anything) the entry is present in; except: ones it isn't.
#     each: a list in the sample data (models, more_models, efforts, question.options, parts,
#       checks.located, standards, standard_kinds: the rule catalogue, fixtures/standards-kinds.json);
#       one entry per item, with {it.<field>} (or {it} for a list of names)
#       filled in. Other {values}: default.model, default.effort,
#       empty_heading, choose_standards, not_connected, question, constraints (standards.yaml:
#       id, title), sized_standard (the first built-in rule whose kind gives sizes: title, sizes,
#       material) and spec (a description giving one standard a value: text, id, title), and for
#       the session canvas (from fixtures/): session, build (+ revision), previous_build
#       (+ revision: the build on the older revision), build_source (+ first_line), checks (+ located and
#       failed: the results with a pin, with label and target, the viewer's data-target, item:
#       the label of its item in the Constraints bar, and place: its place in that item's detail;
#       untested: the count), the fixture build's parts, faces and edges (fixtures/enclosure.gltf:
#       {faces.0.id}, {faces.0.feature}), changes (fixtures/change-set.json: id, title, n: its
#       pin number), parameters (name, label, index, edit: a new value to
#       type), length_param (the first numeric parameter), components (the build's board
#       revision in demos/b-parasite/: ref, role), board_part (the part name of the board) and conflict
#       (the question of fixtures/conflict-events.jsonl).
#     dynamic: true marks a list from the session API (Recents, search results). It may be
#       empty (staging has no sessions; the mock API has whatever other tests created), so
#       coverage doesn't require it, and the behaviour test uses its first item.
#     test_in: the state the behaviour test runs in (default: the first of its states).
#     before: steps run before the interaction (not counted as its effect).
#     action: the interaction (default: click; fill for a textbox). Steps: click <entry id
#       or self>, click_on <locator> (optional modifiers: [Shift] and position: [x, y] inside
#       it), fill <entry> + text, paste <entry> + text (+ repeat: n copies), press <key>,
#       focus <entry>, attach <entry> + files, mouse [x, y],
#       drag_on <locator> + from: [x, y], to: [x, y] (fractions of its box; optional modifiers),
#       wait <locator> (enabled: true waits until enabled; attribute: {name, value} until it
#       has that attribute), goto <url>,
#       mock_session <text> (creates a mock-API session, sends text, waits until the
#       recorded run has finished with a build, then opens /session/{id}).
#     expect: the results, all checked:
#       url <path or /regex/>, visible <locator>, hidden <locator>, attribute {of, name, value},
#       value {of, equals | contains}, focused <locator>,
#       filechooser {multiple, accept, directory, files}, request {method, url regex, body},
#       clipboard: page-url, download: true (a file named like the control's text).
#       A locator is `role "name"` (or text "..."), chained with " >> ";
#       `of` defaults to the entry itself. An attribute value in /slashes/ is a regex.
#     phone: hidden marks a control the phone layout (below 768 px) does not show, because
#       the canvas or artifact already fills the screen there. e2e/phone.spec.ts checks every
#       other entry can be reached at 390 px: the sidebar is a drawer opened with Show sidebar,
#       and the chat and the canvas (or artifact) take the screen one at a time, switched with
#       Show canvas / Close canvas (Open artifact / Close artifact).
#     bug: {fails: behaviour | hygiene, note} marks a known defect (note says what is wrong). A
#       behaviour bug makes the test an expected failure, so it fails once the bug is fixed
#       and the entry needs updating.

ready: "[data-shell-ready=true]"
speech: dictated words

states:
  # Home: the greeting and the large composer.
  - { id: home, screen: home, url: / }
  - id: home.draft
    from: home
    steps: [{ fill: composer.message, text: A small sensor enclosure }]
  - id: home.attached
    from: home
    steps: [{ attach: composer.add-files, files: [sample.step] }]
  - id: home.dictating
    from: home
    steps: [{ click: composer.dictate }]
  - id: home.models
    screen: model and effort picker
    from: home
    steps: [{ click: picker.button }]
  - id: home.effort
    from: home.models
    steps: [{ click: picker.effort }]
  - id: home.more-models
    from: home.models
    steps: [{ click: picker.more-models }]
  - id: home.recents-collapsed
    screen: sidebar
    from: home
    steps: [{ click: sidebar.recents }]
  - id: home.no-sidebar
    from: home
    steps: [{ click: sidebar.hide }]

  # Search, opened from the sidebar. While it is open, only the dialog is reachable.
  - id: search
    screen: search
    from: home
    steps: [{ click: sidebar.search }]
  - id: search.no-match
    from: search
    steps: [{ fill: search.input, text: zzzz-no-such-session }]

  # New canvas: chat on the left, the empty canvas on the right.
  # New waits for the constraint set picker, which loads its sets from the API.
  - id: new
    screen: new canvas
    url: /new
    steps: [{ wait: 'region "Chat" >> button "{choose_standards}"' }]
  - id: new.standards
    screen: constraint set picker
    from: new
    steps: [{ click: standards.button }]
  # The standards editor (docs/constraints.md), opened from the picker. It is modal: only the
  # dialog is reachable. The built-in set (read-only), a duplicate of it (editable), the details
  # of a rule that gives sizes, and a new empty set with the rule catalogue open.
  - id: standards-editor
    screen: constraint set editor
    from: new.standards
    steps:
      - { click: standards.manage }
      - { wait: 'dialog "Manage constraint sets" >> button "Duplicate"' }
  - id: standards-editor.copy
    screen: constraint set editor
    from: standards-editor
    steps:
      - { click: editor.duplicate }
      - { wait: 'dialog "Manage constraint sets" >> textbox "Set name"' }
  - id: standards-editor.details
    screen: constraint set editor
    from: standards-editor.copy
    steps:
      - { click_on: 'dialog "Manage constraint sets" >> button "Details of {sized_standard.title}"' }
      - { wait: 'dialog "Manage constraint sets" >> textbox "{sized_standard.title} title"' }
  - id: standards-editor.new
    screen: constraint set editor
    from: standards-editor
    steps:
      - { click: editor.new-set }
      - { wait: 'dialog "Manage constraint sets" >> textbox "Set name"' }
      - { click: editor.add-rule }
      - { wait: 'dialog "Manage constraint sets" >> region "Add a rule"' }
  - id: new.draft
    from: new
    steps: [{ fill: composer.message, text: Make an enclosure for this board }]
  - id: new.attached
    from: new
    steps: [{ attach: canvas.import, files: [sample.kicad_pcb] }]
  - id: new.no-sidebar
    from: new
    steps: [{ click: sidebar.hide }]
  - id: new.expanded
    from: new
    steps: [{ click: canvas.expand }]
  - id: new.expanded.no-sidebar
    from: new.no-sidebar
    steps: [{ click: canvas.expand }]
  - id: new.canvas-closed
    from: new
    steps: [{ click: canvas.close }]
  - id: new.dictating
    from: new
    steps: [{ click: composer.dictate }]
  - id: new.pasted
    from: new
    steps: [{ paste: composer.message, text: "Sample notes, pasted\n", repeat: 60 }]
  # Chat against the mock session API: the first message moves to /session/<id>, the
  # recorded run's build shows on the canvas, and Claude asks a question; then answered.
  - id: new.question
    screen: chat
    from: new
    mock_api: true
    steps:
      - { fill: composer.message, text: Check the enclosure against the new revision }
      - { click: workspace.send }
      - { wait: 'group "{question.text}" >> button "/^{question.options.0.label} /"', enabled: true }
  - id: new.answered
    from: new.question
    steps:
      - { click: "question.option[0]" }
      - { wait: 'button "/^{question.options.0.label} /"', timeout: 5000 }
  # Constraints, in the canvas's Constraints panel: a description with a value in the
  # user's words ({spec.text}), Claude's question, then answered, with the panel open and that
  # constraint's row expanded; and a constraint's row expanded, then its value being edited.
  - id: new.spec
    from: new
    mock_api: true
    steps:
      - { fill: composer.message, text: "{spec.text}" }
      - { click: workspace.send }
      - { wait: 'group "{question.text}" >> button "/^{question.options.0.label} /"', enabled: true }
  - id: new.spec.answered
    from: new.spec
    steps:
      - { click: "question.option[0]" }
      - { wait: 'region "Canvas" >> testid "check-pins"' }
      - { click: canvas.checks }
      - { click_on: 'region "Canvas" >> list "Constraints" >> button "/^{spec.title} /"' }
      - { wait: 'region "Canvas" >> region "/^Constraint: /" >> button "Back to the set''s value"', enabled: true }
  - id: new.editing
    from: new.answered
    steps:
      - { wait: 'region "Canvas" >> testid "check-pins"' }
      - { click: canvas.checks }
      - { click_on: 'region "Canvas" >> list "Constraints" >> button "/^{constraints.0.title} /"' }
      - { wait: 'region "Canvas" >> region "/^Constraint: /" >> button "Edit {constraints.0.title}"', enabled: true }
      - { click_on: 'region "Canvas" >> region "/^Constraint: /" >> button "Edit {constraints.0.title}"' }

  # The message queue: a mock reply that works for a while ("Take your time", MOCK_SLOW_SECONDS)
  # with Stop under it, two messages sent meanwhile in the queue, one being edited, and the
  # question the reply ends on pausing the queue (Send anyway).
  - id: new.working
    from: new
    mock_api: true
    steps:
      - { fill: composer.message, text: Take your time over this enclosure }
      - { click: workspace.send }
      - { wait: 'region "Chat" >> button "Stop"' }
  - id: new.queued
    from: new.working
    steps:
      - { fill: composer.message, text: Then make the lid thicker }
      - { click: workspace.send }
      - { fill: composer.message, text: And add a vent }
      - { click: workspace.send }
      - { wait: 'region "Queued messages" >> button "Move queued message up"' }
  - id: new.queued.editing
    from: new.queued
    steps: [{ click: queue.edit }]
  - id: new.queued.paused
    from: new.queued
    steps:
      - { wait: 'region "Queued messages" >> button "Send anyway"', timeout: 30000 }

  # After the first message on New: New again, with the session in Recents and Search.
  - id: new.sessions
    from: new.question
    steps: [{ click: sidebar.new }, { wait: 'region "Chat" >> text "{empty_heading}"' }]
  # A session's row menu in Recents (⋯), then renaming it there.
  - id: new.session-menu
    screen: sidebar
    from: new.sessions
    steps: [{ click: sidebar.recent-options }]
  - id: new.renaming
    screen: sidebar
    from: new.session-menu
    steps: [{ click: sidebar.rename }]
  - id: search.sessions
    screen: search
    from: new.sessions
    steps: [{ click: sidebar.search }, { wait: 'dialog "Search sessions" >> button "/ \d{1,2}\/\d{1,2}\/\d{4}$/"' }]
  # A chat whose session is no longer on the server: sending gets a 404 "no session".
  - id: gone
    screen: chat
    url: /session/session-gone-inventory
    mock_api: true
    # The browser logs each request for the gone session as a failed resource load.
    allow_console: "Failed to load resource: the server responded with a status of 404"
    steps:
      - { fill: composer.message, text: Make the lid thicker }
      - { click: workspace.send }
      - { wait: 'region "Chat" >> button "Start a new chat"' }

  # Session canvas: a mock-API session whose recorded run has finished with the fixture
  # build, opened at /session/{id}; then each canvas menu and panel open.
  - id: session
    screen: session canvas
    mock_api: true
    steps:
      - { mock_session: "{session.prompt}" }
      - { wait: 'region "Canvas" >> testid "model-size"' }
      - { wait: 'region "Canvas" >> button "Home view"' }
      - { wait: 'testid "viewer"', attribute: { name: data-state, value: ready } }
      # The feature tree has the build's code: every feature's line link is there.
      - { wait: 'region "Parts" >> button "Lines of {coded_features.0.tag}"' }
      - { wait: 'region "Canvas" >> testid "check-pins"' }
      # The pins: only the failed checks have one by default (the "Check pins" filter).
      - { wait: 'region "Canvas" >> button "{checks.failed.0.label}: {checks.failed.0.status}"' }
      - { wait: 'region "Parts" >> button "Select {board_part}"' }
  # The session's constraint set menu in the chat header (docs/constraints.md). It can't change
  # while Claude works or a question waits.
  - id: session.standards
    screen: constraint set picker
    from: session
    steps:
      - { wait: 'region "Chat" >> button "/^Constraint set: /"', enabled: true }
      - { click: standards.session-button }
  # A part hidden, and a face picked by ID (a chip in the chat).
  - id: session.hidden
    screen: canvas selection
    from: session
    steps: [{ click: "parts.hide[0]" }]
  # The board's components listed under it.
  - id: session.components
    screen: canvas selection
    from: session
    steps:
      - { click: parts.components }
      - { wait: 'region "Parts" >> list "Components"' }
  - id: session.selected
    screen: canvas selection
    from: session
    steps:
      - { click_on: testid "viewer", position: [378, 380] }
      - { wait: 'region "Chat" >> button "Clear selection"' }
  # Find in model from chat: the question answered, then a "Find ..." message; the
  # mock replies with Claude's find, highlighted on the canvas and listed in the chat.
  - id: session.chat-found
    screen: session canvas
    from: session
    steps:
      - { click: "question.option[0]" }
      - { wait: 'button "/^{question.options.0.label} /"', timeout: 5000 }
      - { fill: composer.message, text: Find low draft }
      - { click: workspace.send }
      - { wait: 'region "Chat" >> region "Found in model" >> button "Use as selection"' }
  - id: session.selected.draft
    from: session.selected
    steps: [{ fill: composer.message, text: "Why is this face here?" }]
  # The back, left and bottom of the view cube: the Back-Left-Bottom corner view.
  - id: session.underside
    from: session
    steps:
      - { click: canvas.cube-right-bottom }
      - { click: canvas.cube-back-left-bottom }
      - { wait: 'region "Canvas" >> button "Back"' }
  # The can't-satisfy state: a mock session sent the conflict fixture's locks, so
  # Claude's question comes with the conflict and is pinned on the model.
  - id: session.conflict
    screen: session canvas
    mock_api: true
    steps:
      - { mock_session: "{session.conflict_prompt}" }
      - { wait: 'region "Canvas" >> region "Question on the model"' }
      - { wait: 'region "Chat" >> group "{conflict.text}" >> button "/^{conflict.options.0.label} /"', enabled: true }
  - id: session.conflict.closed
    from: session.conflict
    steps: [{ click: conflict.pin }]
  # The proposed changes panel, expanded from its button.
  - id: session.changes
    from: session
    steps:
      - { click: changes.toggle }
      - { wait: 'region "Proposed changes" >> list "Changes to review"' }
  - id: session.export
    from: session
    steps: [{ click: canvas.export }]
  - id: session.exported
    from: session.export
    steps:
      - { click: canvas.export-download }
      - { wait: 'list "Exported files"' }
  - id: session.checks
    from: session
    steps:
      - { click: canvas.checks }
      - { wait: 'region "Constraints" >> radiogroup "Check pins"' }
  - id: session.code
    from: session
    steps:
      - { click: canvas.code }
      - { wait: 'region "Code" >> testid "code-source"' }
  # The code edited by hand, not yet rebuilt.
  - id: session.code.edited
    from: session.code
    steps:
      - { fill: canvas.code-editor, text: "# Edited by hand\ndef build(params):\n    return dict()\n" }
      - { wait: 'region "Code" >> button "Discard edits"' }
  - id: session.settings
    from: session
    steps: [{ click: canvas.settings }]
  - id: session.zoom
    from: session
    steps: [{ click: canvas.zoom }]
  # The parameters panel; then with a value typed, so the parameter is locked and rebuilt.
  - id: session.parameters
    from: session
    steps:
      - { click: canvas.parameters }
      - { wait: 'region "Parameters" >> textbox "{length_param.label}"' }
  - id: session.parameters.locked
    from: session.parameters
    steps:
      - { fill: "canvas.parameter[{length_param.index}]", text: "{length_param.edit}" }
      - { press: Enter }
      - { wait: 'region "Parameters" >> button "Unlock {length_param.label}"' }
      - { wait: 'region "Parameters" >> region "Rebuild" >> testid "rebuild-summary"' }
  # Undo took the hand edit back: the toast says so, with Redo.
  - id: session.undone
    from: session.parameters.locked
    steps:
      - { click: canvas.undo }
      - { wait: 'region "Canvas" >> status "Design history"' }
  # Claude's change didn't build (the mock's "Break the build" run): the banner over the last good model.
  - id: session.failed
    from: session
    steps:
      - { fill: composer.message, text: Break the build }
      - { press: Enter }
      - { wait: 'region "Canvas" >> alert "Build failed"' }
  # Dimensions shown on the model; then with the first one's field open.
  - id: session.dimensions
    from: session
    steps:
      - { click: canvas.dimensions }
      - { wait: 'region "Canvas" >> group "Dimensions" >> button "Edit {dimension_param.label}"' }
  - id: session.dimensions.editing
    from: session.dimensions
    steps:
      - { click: "canvas.dimension[0]" }
      - { wait: 'region "Canvas" >> group "Dimensions" >> textbox "{dimension_param.label}"' }
  # The keyboard shortcuts sheet. Shortcuts are pressed with focus on a canvas button, not
  # a text field (the composer may have focus on load, and typing never fires a shortcut).
  - id: session.shortcuts
    from: session
    steps:
      - { focus: canvas.view-home }
      - { press: "?" }
      - { wait: 'region "Canvas" >> dialog "Keyboard shortcuts"' }
  # A check result's card, with the whole model back in view (zoomed to fit) so every pin shows.
  - id: session.card
    from: session
    steps:
      - { click: canvas.checks }
      - { click_on: 'region "Canvas" >> list "Constraints" >> button "/^{checks.located.0.item}, /"' }
      - { click_on: 'region "Canvas" >> region "/^Constraint: /" >> button "/^{checks.located.0.status} {checks.located.0.place}( |$)/"' }
      - { press: Escape }
      - { press: Escape }
      - { click: canvas.zoom }
      - { click: canvas.zoom-fit }
  # The Constraints panel with its first row (a failing one) expanded.
  - id: session.constraint
    from: session
    steps:
      - { click: canvas.checks }
      - { click: constraint.item }
      - { wait: 'region "Canvas" >> region "/^Constraint: /"' }
  # Inspection tools: the section cut and its component menu.
  - id: session.section
    screen: canvas inspection
    from: session
    steps:
      - { click: canvas.section }
      - { wait: 'region "Section" >> testid "section-clearance"' }
  - id: session.section.components
    from: session.section
    steps: [{ click: canvas.section-through }]
  # Comments: the comment tool on and a click on the model (a draft comment there); the
  # comment pinned as a note (its thread open); then the comments list.
  - id: session.comment-draft
    screen: comments
    from: session
    steps:
      - { click: comments.tool }
      - { click_on: testid "viewer", position: [378, 380] }
      - { wait: 'region "Canvas" >> dialog "New comment"' }
  - id: session.comment-thread
    screen: comments
    from: session.comment-draft
    steps:
      - { fill: comments.text, text: "Can we add a light pipe here?" }
      - { click: comments.save }
      - { wait: 'region "Canvas" >> dialog "Comment thread"' }
  - id: session.comments-list
    screen: comments
    from: session.comment-thread
    steps:
      - { click: comments.list }
      - { wait: 'region "Comments list" >> list "Comment threads"' }

  # The share menu (share links) on the session canvas; then with a read-only link made.
  - id: session.share
    screen: share menu
    from: session
    steps:
      - { click: canvas.share }
      - { wait: 'dialog "Share" >> region "Share chat" >> button "Create link"', enabled: true }
  - id: session.share.live
    from: session.share
    steps:
      - { click: share.view.create }
      - { wait: 'dialog "Share" >> region "Share chat" >> button "Stop sharing"' }
      # Link copied (Create link copies it) turns back to Copy link after two seconds.
      - { wait: 'dialog "Share" >> region "Share chat" >> button "Copy link"' }

  # A demo (demos/sessions/), opened from its link: /demo/<id> makes this browser's own copy
  # (POST /api/demos/{id}/session) and shows it at its session page, a session like any other,
  # served by the real backend and the mock alike, so it runs against staging too. Its chat,
  # with the canvas closed: the canvas is the session canvas above, with the demo's build in it
  # (frontend/e2e/demos.spec.ts opens every demo on it).
  - id: demo
    screen: demo session
    url: /demo/{samples.0.id}
    steps:
      - { wait: 'region "Chat" >> textbox "Message"' }
      - { wait: 'testid "viewer"', attribute: { name: data-state, value: ready } }
      - { click: canvas.close }
  # The opened demo's row menu in Recents (⋯): Rename and Reset demo; then Reset demo's question.
  - id: demo.session-menu
    screen: sidebar
    from: demo
    steps: [{ click: sidebar.recent-options }]
  - id: demo.resetting
    screen: sidebar
    from: demo.session-menu
    steps: [{ click: sidebar.reset-demo }]

entries:
  # ---------------------------------------------------------------- Sidebar
  - id: sidebar.hide
    screen: sidebar
    role: button
    name: Hide sidebar
    within: complementary "Sidebar"
    states: ["*"]
    except: ["*no-sidebar*", "search*", "standards-editor*"]
    expect:
      - hidden: complementary "Sidebar"
      - visible: button "Show sidebar"
  - id: sidebar.new
    screen: sidebar
    role: link
    name: New
    within: complementary "Sidebar" >> navigation "Navigation"
    states: ["*"]
    except: ["*no-sidebar*", "search*", "standards-editor*"]
    test_in: new.question
    expect:
      - url: /new
      - visible: region "Chat" >> text "{empty_heading}"
  - id: sidebar.search
    screen: sidebar
    role: button
    name: Search
    within: complementary "Sidebar" >> navigation "Navigation"
    states: ["*"]
    except: ["*no-sidebar*", "search*", "standards-editor*"]
    expect:
      - visible: dialog "Search sessions"
      - focused: textbox "Search sessions…"
  - id: sidebar.recents
    screen: sidebar
    role: button
    name: Recents
    within: complementary "Sidebar"
    states: ["*"]
    except: ["*no-sidebar*", "search*", "standards-editor*"]
    expect:
      - attribute: { name: aria-expanded, value: "false" }
      - hidden: list "Recents"
  # One item per session from GET /api/sessions, newest first; the open one is aria-current.
  # A session is named after its first request or its example (`app/titles.py`), so any name;
  # the demos are `sidebar.demo`. Each test's browser lists only its own sessions.
  - id: sidebar.recent
    screen: sidebar
    dynamic: true
    role: link
    name: "/^(?!.* Demo$)/"
    within: complementary "Sidebar" >> list "Recents"
    states: ["*"]
    except: ["*no-sidebar*", "search*", "home.recents-collapsed"]
