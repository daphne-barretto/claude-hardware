      - visible: region "Canvas" >> dialog "Comment thread"
  # ---------------------------------------------------------------- Session canvas: checks on the model
  # Pins sit on the model where their check applies; by default only failed checks have one
  # (the "Check pins" filter), plus the check that is selected.
  - id: checks.pin
    screen: session canvas
    each: checks.failed
    # A pin whose spot is under a panel or an open dialog is hidden there (CheckOverlay), so
    # which pins show depends on the view: not every one is in every state.
    dynamic: true
    role: button
    name: "{it.label}: {it.status}"
    within: region "Canvas"
    states: ["session*", new.question, new.answered]
    # A pin stays on its spot even under a panel: pick its place in the Constraints panel first,
    # which centres the view on it, and close the panel and the card.
    before:
      - { click: canvas.checks }
      - { click_on: 'region "Canvas" >> list "Constraints" >> button "/^{it.item}, /"' }
      - { click_on: 'region "Canvas" >> region "/^Constraint: /" >> button "/^{it.status} {it.place}( |$)/"' }
      - { press: Escape }
      - { press: Escape }
      - { click_on: 'region "Canvas" >> dialog "{it.label}" >> button "Close"' }
    test_in: session
    expect:
      - visible: region "Canvas" >> dialog "{it.label}"
      - attribute: { of: testid "viewer", name: data-target, value: "{it.target}" }
      - attribute: { name: aria-pressed, value: "true" }
  # The selected check's pin shows whatever the filter (here a passed check, picked in the Constraints panel).
  - id: checks.pin-selected
    screen: session canvas
    role: button
    name: "{checks.located.0.label}: {checks.located.0.status}"
    within: region "Canvas"
    states: [session.card]
    before: [{ click: canvas.zoom }, { click: canvas.zoom-50 }]
    expect:
      - visible: region "Canvas" >> dialog "{checks.located.0.label}"
      - attribute: { name: aria-pressed, value: "true" }
  # Which checks show a pin: failed only (the default, remembered per browser), all, or none.
  - id: checks.pins-all
    screen: session canvas
    role: radio
    name: All
    within: region "Canvas" >> region "Constraints" >> radiogroup "Check pins"
    states: [session.checks, session.constraint, new.spec.answered, new.editing]
    test_in: session.checks
    expect:
      - attribute: { name: aria-checked, value: "true" }
  - id: checks.pins-none
    screen: session canvas
    role: radio
    name: None
    within: region "Canvas" >> region "Constraints" >> radiogroup "Check pins"
    states: [session.checks, session.constraint, new.spec.answered, new.editing]
    test_in: session.checks
    expect:
      - attribute: { name: aria-checked, value: "true" }
  - id: checks.pins-failed
    screen: session canvas
    role: radio
    name: Failed
    within: region "Canvas" >> region "Constraints" >> radiogroup "Check pins"
    states: [session.checks, session.constraint, new.spec.answered, new.editing]
    test_in: session.checks
    before: [{ click: checks.pins-none }]
    expect:
      - attribute: { name: aria-checked, value: "true" }
  - id: checks.card-show
    screen: session canvas
    role: button
    name: Show on model
    within: region "Canvas" >> dialog "{checks.located.0.label}"
    states: [session.card]
    expect:
      - attribute: { of: testid "viewer", name: data-target, value: "{checks.located.0.target}" }
      - attribute: { of: testid "viewer", name: data-zoom, value: "300" }
  - id: checks.card-close
    screen: session canvas
    role: button
    name: Close
    within: region "Canvas" >> dialog "{checks.located.0.label}"
    states: [session.card]
    expect:
      - hidden: region "Canvas" >> dialog
