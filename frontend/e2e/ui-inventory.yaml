    role: button
    name: "Edit {it.label}"
    within: region "Canvas" >> group "Dimensions"
    states: [session.dimensions]
    expect:
      - visible: region "Canvas" >> group "Dimensions" >> textbox "{it.label}"
      - focused: region "Canvas" >> group "Dimensions" >> textbox "{it.label}"
  # While one dimension's field is open, the others stay clickable.
  - id: canvas.dimension-other
    screen: session canvas
    role: button
    name: "/^Edit /"
    within: region "Canvas" >> group "Dimensions"
    states: [session.dimensions.editing]
    nth: 0
    expect:
      - visible: region "Canvas" >> group "Dimensions" >> textbox "{dimensions.1.label}"
      - hidden: region "Canvas" >> group "Dimensions" >> textbox "{dimension_param.label}"
  # Typing a value on the model is a hand edit, like the parameters panel: lock, rebuild, checks.
  - id: canvas.dimension-field
    screen: session canvas
    role: textbox
    name: "{dimension_param.label}"
    within: region "Canvas" >> group "Dimensions"
    states: [session.dimensions.editing]
    action: [{ fill: self, text: "{dimension_param.edit}" }, { press: Enter }]
    expect:
