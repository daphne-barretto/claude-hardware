    expect:
      - attribute: { of: testid "viewer", name: data-hidden, value: "" }
      - attribute: { of: 'region "Parts" >> button "Hide: {parts.0}"', name: aria-pressed, value: "false" }
      - hidden: region "Parts" >> button "Show all"
  # The feature tree (fixtures/enclosure.gltf feature tags, fixtures/build-source.json lines).
  - id: features.select
    screen: canvas selection
    each: tagged_features
    role: button
    name: "Select feature: {it.tag}"
    within: region "Parts" >> list "Part list"
    states: ["session*", new.question, new.answered]
    expect:
      - attribute: { of: testid "viewer", name: data-selected, value: "{it.face_ids}" }
      - attribute: { name: aria-current, value: "true" }
      - visible: region "Chat" >> testid "selection-chip"
  - id: features.lines
    screen: canvas selection
    each: coded_features
    role: button
    name: "Lines of {it.tag}"
    within: region "Parts" >> list "Part list"
    states: ["session*", new.question, new.answered]
    expect:
      - visible: region "Code" >> testid "code-feature"
      - attribute: { of: region "Code" >> testid "code-source", name: data-lines, value: "{it.lines_attr}" }
  # Clicks on the model use a point on its right-hand side, clear of the check pins and the parts panel.
  - id: canvas.click-pick
    screen: canvas selection
    role: pointer
    key: click on the model
    states: [session]
    action: [{ click_on: testid "viewer", position: [378, 380] }]
    expect:
      - attribute: { of: testid "viewer", name: data-selected, value: "/^[^,]+$/" }
      - visible: region "Chat" >> testid "selection-chip"
  - id: canvas.shift-click-add
    screen: canvas selection
    role: pointer
    key: shift-click adds to the selection
    states: [session]
    before: [{ click: "parts.select[0]" }]
    action: [{ click_on: testid "viewer", modifiers: [Shift], position: [378, 380] }]
    expect:
      - attribute: { of: testid "viewer", name: data-selected, value: "/^{parts.0},[^,]+$/" }
  - id: canvas.shift-click-remove
    screen: canvas selection
    role: pointer
    key: shift-click on a selected face removes it
    states: [session]
    before:
      - { click_on: testid "viewer", position: [378, 380] }
      - { wait: 'region "Chat" >> testid "selection-chip"' }
    action: [{ click_on: testid "viewer", modifiers: [Shift], position: [378, 380] }]
    expect:
      - attribute: { of: testid "viewer", name: data-selected, value: "" }
      - hidden: region "Chat" >> testid "selection-chip"
  - id: canvas.cmd-click-add
    screen: canvas selection
    role: pointer
    key: Cmd-click (Ctrl-click) adds to the selection
    states: [session]
    before: [{ click: "parts.select[0]" }]
    action: [{ click_on: testid "viewer", modifiers: [ControlOrMeta], position: [378, 380] }]
    expect:
      - attribute: { of: testid "viewer", name: data-selected, value: "/^{parts.0},[^,]+$/" }
  - id: canvas.click-empty
    screen: canvas selection
    role: pointer
    key: click on empty space clears the selection
    states: [session]
    before:
      - { click_on: testid "viewer", position: [378, 380] }
      - { wait: 'region "Chat" >> testid "selection-chip"' }
    # Below the parts panel and left of the model.
    action: [{ click_on: testid "viewer", position: [20, 600] }]
    expect:
      - attribute: { of: testid "viewer", name: data-selected, value: "" }
      - hidden: region "Chat" >> testid "selection-chip"
  - id: canvas.escape-selection
    screen: canvas selection
    role: shortcut
    key: Escape
    states: [session]
    before:
      - { click_on: testid "viewer", position: [378, 380] }
      - { wait: 'region "Chat" >> testid "selection-chip"' }
    action: [{ press: Escape }]
    expect:
      - attribute: { of: testid "viewer", name: data-selected, value: "" }
      - hidden: region "Chat" >> testid "selection-chip"
  - id: chat.clear-selection
    screen: canvas selection
    role: button
    name: Clear selection
    within: region "Chat"
    states: ["session.selected*"]
    expect:
      - attribute: { of: testid "viewer", name: data-selected, value: "" }
      - hidden: region "Chat" >> testid "selection-chip"
  - id: chat.send-selection
    screen: canvas selection
    role: button
    name: Send
    within: region "Chat"
    # Disabled, and says why, until there is something to send (and while Claude replies).
    states: ["session*", new.question, new.answered]
    test_in: session.selected.draft
    expect:
      - request: { method: POST, url: "/messages$", body: { text: "Why is this face here?", selection: { faces: ["{faces.0.id}"] } } }
      - hidden: region "Chat" >> button "Clear selection"
      - attribute: { of: testid "viewer", name: data-selected, value: "" }
