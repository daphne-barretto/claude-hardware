    screen: new canvas
    role: button
    name: Photo or scan
    within: region "Chat"
    states: ["new*"]
    except: ["*expanded*", new.question, new.answered, "new.spec*", new.editing, new.working, "new.queued*"]
    expect:
      - filechooser: { multiple: true, accept: image/*, files: [sample.png] }
      - visible: button "Remove sample.png"
      # What to send with a photo: what to make around it and one real measurement.
      - visible: region "Photo hint"
  - id: workspace.send
    screen: chat
    role: button
    name: Send
    within: region "Chat"
    # Disabled, and says why, until there is something to send (and while Claude replies, and
    # while Claude's question is open: the session API takes only the answer then).
    states: ["new*", "session*", gone, "demo*"]
    except: ["*expanded*"]
    test_in: new.draft
    mock_api: true
    # A staged file is uploaded and goes with the message as an attachment.
    before: [{ attach: canvas.import, files: [sample.kicad_pcb] }]
    expect:
      - url: /^\/session\/[^/]+$/
      - request: { method: POST, url: "/attachments$" }
      - request:
          method: POST
          url: "/messages$"
          body: { text: Make an enclosure for this board, attachments: [{ name: sample.kicad_pcb }] }
      - visible: region "Chat" >> testid "user-message" >> text "sample.kicad_pcb"
      - visible: region "Chat" >> testid "assistant-message"
  # The message queue: Send while Claude works queues the message on the server; the queue
  # shows under the running reply ("Queued · N") until each is sent, in order, as a run ends.
  - id: chat.stop
    screen: chat
    role: button
    name: Stop
    within: region "Chat"
    # Under the running reply; the queue goes on once it stops.
    states: [new.working, new.queued, new.queued.editing]
    expect:
      - request: { method: POST, url: "/stop$" }
      - visible: region "Chat" >> text "Claude's reply ends here"

  - id: queue.move-up
    screen: chat
    role: button
    name: Move queued message up
    within: region "Queued messages"
    # Only on messages that have one before them.
    states: [new.queued, new.queued.editing, new.queued.paused]
    expect:
      - request: { method: PATCH, url: "/queue/[^/]+$", body: { position: 0 } }

  - id: queue.move-down
    screen: chat
    role: button
    name: Move queued message down
    within: region "Queued messages"
    # Only on messages that have one after them.
    states: [new.queued, new.queued.paused]
    expect:
      - request: { method: PATCH, url: "/queue/[^/]+$", body: { position: 1 } }

  - id: queue.edit
    screen: chat
    role: button
    name: Edit queued message
    nth: 0
    within: region "Queued messages"
    states: [new.queued, new.queued.editing, new.queued.paused]
    expect:
      - visible: region "Queued messages" >> textbox "Edit queued message"

  - id: queue.edit-text
    screen: chat
    role: textbox
    name: Edit queued message
    within: region "Queued messages"
    states: [new.queued.editing]
    expect:
      - value: { equals: Inventory check }

  - id: queue.save
    screen: chat
    role: button
    name: Save
    within: region "Queued messages"
    states: [new.queued.editing]
    before: [{ fill: queue.edit-text, text: Then make the lid 3 mm thick }]
    expect:
      - request: { method: PATCH, url: "/queue/[^/]+$", body: { text: Then make the lid 3 mm thick } }
      - visible: region "Queued messages" >> text "Then make the lid 3 mm thick"

  - id: queue.cancel-edit
    screen: chat
    role: button
    name: Cancel
    within: region "Queued messages"
    states: [new.queued.editing]
    expect:
      - hidden: region "Queued messages" >> textbox "Edit queued message"

  - id: queue.remove
    screen: chat
    role: button
    name: Remove queued message
    nth: 0
    within: region "Queued messages"
    states: [new.queued, new.queued.editing, new.queued.paused]
    expect:
      - request: { method: DELETE, url: "/queue/[^/]+$" }
      - hidden: region "Queued messages" >> text "Then make the lid thicker"

  # Claude's question pauses the queue (a queued message is never taken as the answer).
  - id: queue.send-anyway
    screen: chat
    role: button
    name: Send anyway
    within: region "Queued messages"
    states: [new.queued.paused]
    expect:
      - request: { method: POST, url: "/queue/[^/]+/send$" }
      - visible: 'region "Chat" >> text "The question was left unanswered"'

  # The chat's session is gone: a new chat creates a session and opens it.
  - id: chat.start-new-chat
    screen: chat
    role: button
    name: Start a new chat
    within: region "Chat"
    states: [gone]
    expect:
      - request: { method: POST, url: "/api/sessions$" }
      - hidden: region "Chat" >> button "Start a new chat"
      - visible: region "Chat" >> text "{empty_heading}"
  - id: question.option
    screen: chat
    each: question.options
    role: button
    name: "{it.label} {it.description}"
    within: group "{question.text}"
    states: [new.question, new.answered, "new.spec*", new.editing, new.queued.paused, "session*"]
    except: ["session.conflict*"]
    test_in: new.question
    expect:
      - request: { method: POST, url: "/messages$", body: { answer: { question_id: "{question.question_id}", option_id: "{it.id}" } } }
      - attribute: { name: aria-pressed, value: "true" }
    # Disabled while Claude is still replying and once answered; each says why. Also
    # disabled, saying why, once Claude went on past it: a reopened live session's resumed run.
  # The Constraints panel's rows: one per constraint (or check with no constraint),
  # failing first; a row expands to its value, source and places. Editing is disabled, and says
  # why, while Claude replies or waits for an answer, and on a shared link.
  - id: constraint.item
    screen: session canvas
    role: button
    name: "/, (failing|untested|not checked yet|passing|not applicable)(, \\d+ places)?$/"
    nth: 0
    within: region "Canvas" >> region "Constraints" >> list "Constraints"
    # Before a first build, the empty canvas shows the panel open (new.working, the queue).
    states: [session.checks, session.constraint, new.spec.answered, new.editing, new.working, "new.queued*"]
    test_in: session.checks
    expect:
      - attribute: { name: aria-expanded, value: "true" }
      - visible: 'region "Canvas" >> region "/^Constraint: /"'
  # The empty canvas's Constraints button, before a first build: shows and hides the panel.
  - id: constraint.before-build
    screen: new canvas
    role: button
    name: Constraints
    within: region "Canvas"
    # Only while nothing is built yet: the toolbar's Constraints button takes over after.
    dynamic: true
    states: ["new*"]
    test_in: new.working
    expect:
      - attribute: { name: aria-expanded, value: "false" }
      - hidden: region "Canvas" >> region "Constraints"
  # Not applicable constraints wait behind their own button under the list.
  - id: constraint.not-applicable
    screen: session canvas
    role: button
    name: "/^(\\d+ not applicable|Hide not applicable)$/"
    within: region "Canvas" >> region "Constraints"
    # Only where the build's checks have one that doesn't apply.
    dynamic: true
    states: [session.checks, session.constraint, new.spec.answered, new.editing]
    test_in: session.checks
    expect:
      - attribute: { name: aria-expanded, value: "true" }
      - visible: region "Constraints" >> button "Hide not applicable"
  # A row's places select and locate a result on the model, as its pin does.
  - id: constraint.place
    screen: session canvas
    role: button
    name: "/^(pass|fail) /"
    nth: 0
    within: 'region "Canvas" >> region "/^Constraint: /" >> list "Places checked"'
    states: [session.constraint, new.spec.answered, new.editing]
    test_in: session.constraint
    expect:
      - attribute: { name: aria-pressed, value: "true" }
      - visible: region "Canvas" >> testid "check-card"
  - id: constraint.edit
    screen: session canvas
    role: button
    name: "/^Edit /"
    within: 'region "Canvas" >> region "/^Constraint: /"'
    states: [session.constraint, new.spec.answered]
    test_in: new.spec.answered
    expect:
      - visible: 'region "Canvas" >> region "/^Constraint: /" >> textbox "{spec.title}"'
  # A value from the user's words (or an edit) goes back to the constraint set's value.
  - id: constraint.back
    screen: session canvas
    role: button
    name: Back to the set's value
    within: 'region "Canvas" >> region "/^Constraint: /"'
    states: [new.spec.answered]
    expect:
      - request: { method: DELETE, url: "/constraints/{spec.id}$" }
      - hidden: 'region "Canvas" >> region "/^Constraint: /" >> button "Back to the set''s value"'
  - id: constraint.value
    screen: session canvas
    role: textbox
    name: "{constraints.0.title}"
    within: 'region "Canvas" >> region "/^Constraint: /"'
    states: [new.editing]
    expect:
      - value: { equals: Inventory check }
  - id: constraint.save
    screen: session canvas
    role: button
    name: Save {constraints.0.title}
    within: 'region "Canvas" >> region "/^Constraint: /"'
    states: [new.editing]
    expect:
      - request: { method: PATCH, url: "/constraints/{constraints.0.id}$" }
      - hidden: 'region "Canvas" >> region "/^Constraint: /" >> textbox "{constraints.0.title}"'
  - id: constraint.cancel
    screen: session canvas
    role: button
    name: Cancel
    within: 'region "Canvas" >> region "/^Constraint: /"'
    states: [new.editing]
    expect:
      - hidden: 'region "Canvas" >> region "/^Constraint: /" >> textbox "{constraints.0.title}"'
  # Risks Claude flagged: each line shows its location on the canvas (a session's canvas
  # only), and its fix is accepted or ignored on its own, apart from the change set.
  - id: chat.risk-show
    screen: chat
    each: risks
    role: button
    name: "{it.message}"
    within: region "Chat" >> region "Flagged risks"
    states: ["session*"]
    test_in: session
    expect:
      - attribute: { of: 'region "Canvas" >> testid "viewer"', name: data-target, value: "{it.target}" }
      - visible: region "Chat" >> button "Clear selection"
  - id: chat.risk-accept
    screen: chat
    each: risks
    role: button
    name: "Accept the fix for {it.subject}"
    within: region "Chat" >> region "Flagged risks"
    states: [new.answered, "session*"]
    test_in: session
    expect:
      - request: { method: POST, url: "/risks$", body: { accept: ["{it.id}"] } }
      - attribute: { name: aria-pressed, value: "true" }
    # Disabled while Claude replies or a fix rebuilds, and once accepted; each says why.
  - id: chat.risk-ignore
    screen: chat
    each: risks
    role: button
    name: "Ignore the fix for {it.subject}"
    within: region "Chat" >> region "Flagged risks"
    states: [new.answered, "session*"]
    test_in: session
    expect:
      - request: { method: POST, url: "/risks$", body: { reject: ["{it.id}"] } }
      - attribute: { name: aria-pressed, value: "true" }
  # Faces Claude found from chat: highlighted again on the canvas, or made the
  # selection the next message carries.
  - id: chat.found-show
    screen: chat
    role: button
    name: Show on model
    within: region "Chat" >> region "Found in model"
    states: [session.chat-found]
    expect:
      - attribute: { of: 'region "Canvas" >> testid "viewer"', name: data-selected, value: "/./" }
  - id: chat.found-select
    screen: chat
    role: button
    name: Use as selection
    within: region "Chat" >> region "Found in model"
    states: [session.chat-found]
    expect:
      - visible: region "Chat" >> testid "selection-chip"
  # Notices add no controls, so they have no entries: the chat's "Claude won't design
  # this" card (role note, data-testid refused-notice), its safety notice card (role note "Safety
  # notice: requirements not checked", data-testid safety-notice, with the list "Regulations that
  # may apply") and the canvas header's "Regulations not checked" badge (role note, its title
  # lists the regulations; data-testid canvas-safety-notice). None of them is in a mock-API state:
  # the recorded run has no notice.

  # The can't-satisfy state: the conflict card and its options in the chat.
  - id: conflict.option
    screen: chat
    each: conflict.options
    role: button
    name: "{it.label} {it.description}"
    within: region "Chat"
    states: ["session.conflict*"]
    expect:
      - request: { method: POST, url: "/messages$", body: { answer: { question_id: "{conflict.question_id}", option_id: "{it.id}" } } }
      - attribute: { name: aria-pressed, value: "true" }
      - hidden: region "Canvas" >> button "Claude's question"
  # ---------------------------------------------------------------- Canvas panel
  - id: canvas.show-sidebar
    screen: canvas
    role: button
    name: Show sidebar
    within: region "Canvas"
    states: [new.expanded.no-sidebar]
    expect:
      - visible: complementary "Sidebar"
  # Claude's question pinned at its spot on the model: the marker opens and closes the
  # card with the conflict and the options.
  - id: conflict.pin
    screen: session canvas
    role: button
    name: Claude's question
    within: region "Canvas"
    states: ["session.conflict*"]
    test_in: session.conflict
    expect:
      - attribute: { name: aria-expanded, value: "false" }
      - hidden: region "Question on the model"
  - id: conflict.pin-option
    screen: session canvas
    each: conflict.options
    role: button
    name: "{it.label} {it.description}"
    within: region "Canvas" >> region "Question on the model"
    states: [session.conflict]
    expect:
      - request: { method: POST, url: "/messages$", body: { answer: { question_id: "{conflict.question_id}", option_id: "{it.id}" } } }
      - attribute: { of: 'region "Chat" >> group "{conflict.text}" >> button "/^{it.label} /"', name: aria-pressed, value: "true" }
      - hidden: region "Canvas" >> button "Claude's question"
  # Share on a session of one's own opens the share menu (share links): a read-only link to the
  # chat and model, or a link to make an editable copy of the design. A session not yet made
  # (New) or gone has none. On a shared link, Share copies the page link instead.
  - id: canvas.share
    screen: canvas
    role: button
    name: Share
    within: region "Canvas"
    states: [new.question, new.answered, "new.spec*", new.editing, "session*"]
    expect:
      - visible: dialog "Share" >> region "Share chat"
      - visible: dialog "Share" >> region "Share a copy"
  - id: share.view.attachments
    screen: share menu
    role: checkbox
    name: Include attached files (otherwise only their names)
    within: dialog "Share" >> region "Share chat"
    states: ["session.share*"]
    expect:
      - attribute: { of: dialog "Share" >> region "Share chat", name: data-attachments, value: "on" }
  - id: share.view.create
    screen: share menu
    role: button
    name: Create link
    within: dialog "Share" >> region "Share chat"
    states: [session.share]
    expect:
      - request: { method: POST, url: "/shares$", body: { kind: view, attachments: false } }
      - visible: dialog "Share" >> region "Share chat" >> button "Stop sharing"
  - id: share.copy.create
    screen: share menu
    role: button
    name: Create link
    within: dialog "Share" >> region "Share a copy"
    states: ["session.share*"]
    expect:
      - request: { method: POST, url: "/shares$", body: { kind: copy, attachments: false } }
      - visible: dialog "Share" >> region "Share a copy" >> button "Stop sharing"
  - id: share.view.copy
    screen: share menu
    role: button
    name: Copy link
    within: dialog "Share" >> region "Share chat"
    states: [session.share.live]
    expect:
      - visible: dialog "Share" >> region "Share chat" >> button "Link copied"
  - id: share.view.update
    screen: share menu
    role: button
    name: Update link
    within: dialog "Share" >> region "Share chat"
    states: [session.share.live]
    expect:
      - request: { method: POST, url: "/shares/update$", body: { kind: view, attachments: false } }
  - id: share.view.stop
    screen: share menu
    role: button
    name: Stop sharing
    within: dialog "Share" >> region "Share chat"
    states: [session.share.live]
    expect:
      - request: { method: POST, url: "/shares/revoke$", body: { kind: view } }
      - visible: dialog "Share" >> region "Share chat" >> button "Create link"
  - id: canvas.expand
    screen: canvas
    role: button
    name: Expand canvas
    within: region "Canvas"
    states: ["new*", "session*", gone]
    except: ["*expanded*", new.canvas-closed]
    expect:
      - hidden: region "Chat"
      - visible: button "Restore canvas"
    phone: hidden
  - id: canvas.restore
    screen: canvas
    role: button
    name: Restore canvas
    within: region "Canvas"
    states: ["new.expanded*"]
    expect:
      - visible: region "Chat"
      - visible: button "Expand canvas"
    phone: hidden
  - id: canvas.close
    screen: canvas
    role: button
    name: Close canvas
    within: region "Canvas"
    states: ["new*", "session*", gone]
    except: [new.canvas-closed]
    expect:
      - hidden: region "Canvas"
      - visible: button "Show canvas"
  - id: canvas.import
    screen: canvas
    role: button
    name: Import a file
    within: region "Canvas"
    states: ["new*", gone]
    except: [new.canvas-closed, new.question, new.answered]
    expect:
      - filechooser: { multiple: true, files: [sample.step] }
      - visible: button "Remove sample.step"
  - id: canvas.unit-in
    screen: session canvas
    role: radio
    name: in
    within: region "Canvas" >> radiogroup "Units"
    states: ["session*", new.question, new.answered]
    expect:
      - attribute: { name: aria-checked, value: "true" }
      - visible: region "Canvas" >> text "/ × .* in$/"
  - id: canvas.unit-mm
    screen: session canvas
    role: radio
    name: mm
    within: region "Canvas" >> radiogroup "Units"
    states: ["session*", new.question, new.answered]
    before: [{ click: canvas.unit-in }]
    expect:
      - attribute: { name: aria-checked, value: "true" }
      - visible: region "Canvas" >> text "/ × .* mm$/"
  - id: canvas.export
    screen: session canvas
    role: button
    name: Export
    within: region "Canvas" >> toolbar "Canvas controls"
    states: ["session*", new.question, new.answered]
    expect:
      - attribute: { name: aria-expanded, value: "true" }
      - visible: region "Export" >> button "/^Download \d+ files?$/"
  - id: canvas.export-format-step
    screen: session canvas
    role: checkbox
    name: STEP
    within: region "Export"
    states: [session.export, session.exported]
    expect:
      - attribute: { of: region "Export", name: data-formats, value: "build_note" }
  - id: canvas.export-format-pdf
    screen: session canvas
    role: checkbox
    name: PDF drawing
    within: region "Export"
    states: [session.export, session.exported]
    expect:
      - attribute: { of: region "Export", name: data-formats, value: "step,pdf,build_note" }
  - id: canvas.export-format-source
    screen: session canvas
    role: checkbox
    name: Source code
    within: region "Export"
    states: [session.export, session.exported]
    expect:
      - attribute: { of: region "Export", name: data-formats, value: "step,source,build_note" }
  - id: canvas.export-build-note
    screen: session canvas
    role: checkbox
    name: Include build note
    within: region "Export"
    states: [session.export, session.exported]
    expect:
      - attribute: { of: region "Export", name: data-formats, value: "step" }
  - id: canvas.export-cancel
    screen: session canvas
    role: button
    name: Cancel
    within: region "Export"
    states: [session.export, session.exported]
    expect:
      - hidden: region "Export"
      - attribute: { of: 'region "Canvas" >> toolbar "Canvas controls" >> button "Export"', name: aria-expanded, value: "false" }
  - id: canvas.export-download
    screen: session canvas
    role: button
    name: "/^Download \\d+ files?$/"
    within: region "Export"
    states: [session.export, session.exported]
    test_in: session.export
    expect:
      - request: { method: POST, url: "/exports$", body: { build_id: "{build.id}" } }
      - visible: region "Export" >> list "Exported files"
  - id: canvas.exported-file
    screen: session canvas
    role: link
    name: /./
    within: region "Export" >> list "Exported files"
    # One per exported file; the behaviour test downloads the first.
    nth: 0
    states: [session.exported]
    expect:
      - download: true
  # The Constraints panel: the checks' summary, the check pins filter, and a row per
  # constraint, failing first.
  - id: canvas.checks
    screen: session canvas
    role: button
    name: Constraints
    within: region "Canvas" >> toolbar "Canvas controls"
    states: ["session*", new.question, new.answered, "new.spec*", new.editing]
    expect:
      - attribute: { name: aria-expanded, value: "true" }
      - visible: region "Constraints" >> text "{checks.summary.pass} pass · {checks.summary.fail} fail · {checks.summary.untested} untested"
  - id: canvas.code
    screen: session canvas
    role: button
    name: Code
    within: region "Canvas" >> toolbar "Canvas controls"
    states: ["session*", new.question, new.answered]
    # The build's CAD source (fixtures/build-source.json).
    expect:
      - attribute: { name: aria-expanded, value: "true" }
      - visible: region "Code" >> text "{build_source.filename} · {build_source.backend} · {build.revision}"
      - attribute: { of: region "Code" >> testid "code-source", name: data-build, value: "{build_source.build_id}" }
      - value: { of: region "Code" >> textbox "Generator code", contains: "{build_source.first_line}" }
  # The code is editable: typing marks it edited; Rebuild rebuilds and rechecks.
  - id: canvas.code-editor
    screen: session canvas
    role: textbox
    name: Generator code
    within: region "Canvas" >> region "Code"
    states: ["session.code*"]
    test_in: session.code
    action: [{ fill: self, text: "# Edited by hand\ndef build(params):\n    return dict()\n" }]
    expect:
      - attribute: { name: data-edited, value: "true" }
      - visible: region "Code" >> button "Discard edits"
  - id: canvas.code-rebuild
    screen: session canvas
    role: button
    name: Rebuild
    within: region "Canvas" >> region "Code"
    states: ["session.code*"]
    test_in: session.code.edited
    expect:
      - request: { method: PUT, url: "/source$", body: { build_id: "{build.id}" } }
      - visible: region "Code" >> testid "code-rebuilt"
  - id: canvas.code-discard
    screen: session canvas
    role: button
    name: Discard edits
    within: region "Canvas" >> region "Code"
    states: [session.code.edited]
    expect:
      - attribute: { of: region "Code" >> textbox "Generator code", name: data-edited, value: "false" }
      - value: { of: region "Code" >> textbox "Generator code", contains: "{build_source.first_line}" }
  - id: canvas.settings
    screen: session canvas
    role: button
    name: View settings
    within: region "Canvas" >> toolbar "Canvas controls"
    states: ["session*", new.question, new.answered]
    expect:
      - attribute: { name: aria-expanded, value: "true" }
      - visible: region "View settings" >> checkbox "Edges"
  - id: canvas.edges
    screen: session canvas
    role: checkbox
    name: Edges
    within: region "View settings"
    states: [session.settings]
    expect:
      - attribute: { of: testid "viewer", name: data-edges, value: "false" }
  - id: canvas.grid
    screen: session canvas
    role: checkbox
    name: Grid
    within: region "View settings"
    states: [session.settings]
    expect:
      - attribute: { of: testid "viewer", name: data-grid, value: "false" }
  - id: canvas.parameters
    screen: session canvas
    role: button
    name: Parameters
    within: region "Canvas" >> toolbar "Canvas controls"
    states: ["session*", new.question, new.answered]
    test_in: session
    expect:
      - attribute: { name: aria-pressed, value: "true" }
      - visible: region "Canvas" >> region "Parameters" >> textbox "{length_param.label}"
  # Typing a value is a hand edit: it locks the parameter and rebuilds.
  - id: canvas.parameter
    screen: session canvas
    each: parameters
    role: textbox
    name: "{it.label}"
    within: region "Canvas" >> region "Parameters"
    states: ["session.parameters*"]
    action: [{ fill: self, text: "{it.edit}" }, { press: Enter }]
    expect:
      - request: { method: PATCH, url: "/parameters/{it.name}$" }
      - visible: region "Parameters" >> button "Unlock {it.label}"
      - visible: region "Parameters" >> region "Rebuild"
  - id: canvas.parameter-unlock
    screen: session canvas
    role: button
    name: "Unlock {length_param.label}"
    within: region "Canvas" >> region "Parameters"
    states: [session.parameters.locked]
    expect:
      - request: { method: PATCH, url: "/parameters/{length_param.name}$", body: { locked: false } }
      - hidden: region "Parameters" >> button "Unlock {length_param.label}"
      - visible: region "Parameters" >> text "/{length_param.label} is Claude's again/"
  - id: canvas.undo
    screen: session canvas
    role: button
    name: Undo
    within: region "Canvas" >> toolbar "Canvas controls"
    states: ["session*"]
    test_in: session.parameters.locked
    expect:
      - request: { method: POST, url: "/history/undo$" }
      - visible: 'region "Canvas" >> status "Design history"'
  - id: canvas.redo
    screen: session canvas
    role: button
    name: Redo
    within: region "Canvas" >> toolbar "Canvas controls"
    states: ["session*"]
    test_in: session.parameters.locked
    before: [{ click: canvas.undo }, { wait: 'region "Canvas" >> toolbar "Canvas controls" >> button "Redo"', enabled: true }]
    expect:
      - request: { method: POST, url: "/history/redo$" }
  # The toast after an undo or redo: "Undid: You: hole ⌀3 mm", with Redo (Undo after a redo).
  - id: history.toast-again
    screen: session canvas
    role: button
    name: Redo
    within: region "Canvas" >> status "Design history"
    states: [session.undone]
    expect:
      - request: { method: POST, url: "/history/redo$" }
  - id: history.toast-dismiss
    screen: session canvas
    role: button
    name: Dismiss
    within: region "Canvas" >> status "Design history"
    states: [session.undone]
    expect:
      - hidden: 'region "Canvas" >> status "Design history"'
