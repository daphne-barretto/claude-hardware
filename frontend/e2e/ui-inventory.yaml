    screen: sidebar
    role: menuitem
    name: Reset demo
    within: complementary "Sidebar" >> menu
    states: [demo.session-menu]
    expect:
      - visible: complementary "Sidebar" >> menu >> text "/Your changes to this demo are deleted/"
  # Reset: this browser's copy is deleted (DELETE /api/demos/{id}/session) and, as it was open,
