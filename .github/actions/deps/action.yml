name: Install dependencies
description: >
  Python, Node, the backend venv, frontend node_modules and the Playwright
  Chromium browser, restored from cache while backend/pyproject.toml,
  frontend/package-lock.json and the Playwright version are unchanged.
runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/pyproject.toml
    - id: node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - id: keys
      shell: bash
      run: |
        echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
        echo "playwright=$(node -p "require('./frontend/package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
    # Restore now and save right after the install (not at the end of the
    # job), so what an agent installs later never ends up in the cache.
    # The venv links to the exact Python build, so the key includes it.
    - id: venv
      uses: actions/cache/restore@v4
      with:
        path: backend/.venv
        key: venv-${{ runner.os }}-${{ steps.keys.outputs.image }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('backend/pyproject.toml') }}
    - id: modules
      uses: actions/cache/restore@v4
      with:
        path: frontend/node_modules
        key: node-modules-${{ runner.os }}-${{ steps.keys.outputs.image }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('frontend/package-lock.json') }}
    - id: browsers
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.keys.outputs.image }}-${{ steps.keys.outputs.playwright }}
    - name: Install
      shell: bash
      env:
        VENV_HIT: ${{ steps.venv.outputs.cache-hit }}
        MODULES_HIT: ${{ steps.modules.outputs.cache-hit }}
      run: |
        # Restored stamps are older than the fresh checkout of the lock files,
        # which would make `make install` reinstall. The cache key matches the
        # lock files, so mark them current.
        if [ "$VENV_HIT" = true ]; then touch backend/.venv/.installed; fi
        if [ "$MODULES_HIT" = true ]; then touch frontend/node_modules/.installed; fi
        make install
        cd frontend && npx playwright install --with-deps chromium
    - if: steps.venv.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: backend/.venv
        key: ${{ steps.venv.outputs.cache-primary-key }}
    - if: steps.modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: frontend/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}
    - if: steps.browsers.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.browsers.outputs.cache-primary-key }}
